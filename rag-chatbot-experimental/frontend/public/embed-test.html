<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulation iframe locale - Assistant DPC</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #eef3f5;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        display: grid;
        gap: 16px;
        padding: 24px;
      }

      h1 {
        margin: 0;
        font-size: 1.25rem;
        color: #18313b;
      }

      p {
        margin: 0;
        color: #526775;
      }

      iframe {
        width: min(420px, calc(100vw - 32px));
        height: min(700px, calc(100vh - 140px));
        border: 1px solid #c8d3da;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 18px 55px rgba(24, 32, 42, 0.22);
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>Simulation iframe locale</h1>
        <p>Cette page simule une intégration iframe. Ce n'est pas SharePoint et elle ne contient aucun secret.</p>
      </div>
      <iframe
        src="http://localhost:5173/embed"
        width="420"
        height="700"
        style="border:1px solid #ccc;"
        title="Assistant DPC"
      ></iframe>
    </main>
  </body>
</html>
